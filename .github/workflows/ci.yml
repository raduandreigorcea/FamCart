name: CI

# Triggers on push again, plainly, because there is no longer a second commit to
# chase. The version bump happens in .githooks/pre-commit, inside the commit you
# make, so the commit you push is the only one there is — and a push-triggered run
# attaches its result to exactly that commit.
#
# This briefly worked the other way round: version-bump.yml pushed a follow-up
# commit, which GitHub's loop protection meant could start nothing, so CI had to
# be dispatched back at it. Deleting that workflow deleted the problem.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # The catalog importer (catalog-importer/) is a submodule carrying
      # byte-for-byte copies of src/lib/productSearch.ts and productEmoji.ts.
      # Without checking it out, test/vendorDrift.test.js skips itself and a
      # divergent copy would reach an import unnoticed. The submodule repo is
      # public, so this needs no token.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rls-tests:
    name: Database RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts local Postgres and applies supabase/migrations, then runs the
      # pgTAP suites in supabase/tests.
      - run: supabase db start
      - run: supabase test db
