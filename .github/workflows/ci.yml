name: CI

# WHY THIS DOES NOT TRIGGER ON PUSH TO MASTER
#
# version-bump.yml commits the new version straight after any push to master, so
# that bump commit — not yours — is what sits at the top of the commit list and
# what the checkmark on GitHub's file header refers to. A push-triggered run
# attaches to the commit you pushed, one below, and GitHub's own loop protection
# stops the bump commit from starting anything. The result was a green tick on
# master that showed only Vercel, with the real test results hidden one commit
# down.
#
# So the bump workflow dispatches this the moment the new version is pushed, the
# same way it dispatches the APK build. Everything then reports against the commit
# actually at the top of the branch: unit tests, pgTAP, the APK, and Vercel.
#
# Pull requests are untouched and still run on every push to a branch — that is
# the gate before merge; this is the record after it.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # The catalog importer (catalog-importer/) is a submodule carrying
      # byte-for-byte copies of src/lib/productSearch.ts and productEmoji.ts.
      # Without checking it out, test/vendorDrift.test.js skips itself and a
      # divergent copy would reach an import unnoticed. The submodule repo is
      # public, so this needs no token.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rls-tests:
    name: Database RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts local Postgres and applies supabase/migrations, then runs the
      # pgTAP suites in supabase/tests.
      - run: supabase db start
      - run: supabase test db
