name: CI

# Triggers on push again, plainly, because there is no longer a second commit to
# chase. The version bump happens in .githooks/pre-commit, inside the commit you
# make, so the commit you push is the only one there is — and a push-triggered run
# attaches its result to exactly that commit.
#
# This briefly worked the other way round: version-bump.yml pushed a follow-up
# commit, which GitHub's loop protection meant could start nothing, so CI had to
# be dispatched back at it. Deleting that workflow deleted the problem.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # The catalog importer (catalog-importer/) is a submodule carrying
      # byte-for-byte copies of src/lib/productSearch.ts and productEmoji.ts.
      # Without checking it out, test/vendorDrift.test.js skips itself and a
      # divergent copy would reach an import unnoticed. The submodule repo is
      # public, so this needs no token.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency advisories, which nothing else here would notice. Scoped to
      # production dependencies on purpose: a dev-only advisory is real but
      # cannot reach a user, and failing the build over one means the next
      # genuine finding arrives in a step that is already red and being ignored.
      # --audit-level=high for the same reason — moderate advisories on a
      # transitive build tool are noise at this project's size.
      - run: npm audit --omit=dev --audit-level=high
      # Before typecheck: lint failures are usually the cheaper thing to read,
      # and this is the step most likely to catch a template mistake vue-tsc
      # cannot see.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rls-tests:
    name: Database RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      # `db start` does NOT reliably apply supabase/migrations: where a local
      # backup exists it restores that and skips them. A cold runner has no
      # backup, so this job happened to be testing the real schema — but the same
      # two commands are what gets run on a developer's machine, where the backup
      # does exist and the suite then passes against a schema the migrations were
      # never applied to. `db reset` rebuilds from supabase/migrations every time,
      # so CI and local runs are testing the same thing.
      - run: supabase db reset
      # The pgTAP suites in supabase/tests, against that schema.
      - run: supabase test db

  catalog-tests:
    name: Catalog database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      # submodules: true is REQUIRED here, not a convenience. The catalog
      # project's schema lives in the catalog-importer repo, because that repo is
      # the only thing that writes that database; this app is a client of it,
      # calling search_catalog() over PostgREST and owning neither the table nor
      # the RPCs. Without the checkout there is no supabase-catalog/ to point at
      # and every step below fails on a missing config.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # WHY THIS JOB STAYS IN THE APP'S CI EVEN THOUGH THE SCHEMA IS ELSEWHERE
      #
      # The dependency runs the other way from the ownership. src/lib/
      # productSuggestions.ts calls search_catalog(p_query, p_limit, p_markets)
      # and reads (name, maker, popularity) back, so a change to that RPC in the
      # other repo breaks this app with nothing in this repo to warn anyone.
      # Running the catalog's own pgTAP suite here is what turns that into a red
      # build instead of an empty suggestions dropdown in production.
      #
      # --workdir names a project ROOT, not a config file: the CLI looks for
      # `<workdir>/supabase/config.toml` beneath it, which is why the path is
      # doubled. Get that wrong and the CLI silently falls back to defaults and
      # runs against the wrong schema.
      #
      # Its own job rather than more steps on the one above, because both stacks
      # would otherwise be up at once on the same runner, competing for the same
      # ports. The catalog's config.toml moves its ports for exactly that reason
      # locally; here they simply never meet.
      - run: supabase db start --workdir catalog-importer/supabase-catalog
      # Same reason as above: db start may restore a backup instead of applying
      # the migrations, and then the suite tests a schema nobody wrote.
      - run: supabase db reset --workdir catalog-importer/supabase-catalog
      - run: supabase test db --workdir catalog-importer/supabase-catalog
