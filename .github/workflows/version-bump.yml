name: Version bump

# Bumps the patch version on every push to master and commits it back, so the
# number in Settings -> About moves on its own rather than by remembering to
# edit package.json. vite.config.js reads that field at build time into
# __APP_VERSION__, so nothing else has to know about this.
#
# WHY THIS DOES NOT LOOP
#
# A push made with GITHUB_TOKEN deliberately does not trigger workflows. That is
# GitHub's own loop protection and it is what makes this safe: the bump commit
# cannot start another bump, and it does not re-run CI or the APK build either.
# The `if` below is belt and braces for the case where someone swaps in a PAT,
# which does not get that protection.
#
# WHY THERE IS NO [skip ci] MARKER
#
# Vercel is not GitHub Actions. Its integration is a separate GitHub App
# listening to push webhooks, so it redeploys on the bump commit even though the
# Actions above stay quiet. That is the behaviour we want: the push you make
# builds with the old number, and the bump that follows a few seconds later
# redeploys with the new one, so what is actually live matches what About says.
# Adding [skip ci] would suppress that redeploy and leave the deployed app one
# version behind forever.
#
# HOW THE APK KEEPS UP
#
# This used to be a known gap: release-apk.yml ran on push, so it built from the
# commit *before* the bump and the published APK trailed the web app by one patch
# forever. It no longer triggers on push at all — the last step here dispatches
# it once the new version is pushed, so it builds a tree that already contains
# the bump and the two agree.
#
# That works because workflow_dispatch is one of only two events (with
# repository_dispatch) that GitHub exempts from the GITHUB_TOKEN loop protection
# described above. The protection is what stops the bump commit re-running CI;
# the exemption is what lets us ask for the one build we do want. No PAT needed,
# and no loop: the APK workflow pushes nothing.

on:
  push:
    branches: [master]

# Two merges landing close together would otherwise race: both read the same
# version, both write the next one, and the second push is rejected as a
# non-fast-forward. Serialised, the second waits and reads the first's result.
concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # dispatch the APK build once the bump is pushed

jobs:
  bump:
    name: Bump patch version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A default checkout lands on a detached head, which cannot be pushed
          # from. Name the branch so the commit below has somewhere to go.
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --no-git-tag-version keeps npm away from git entirely: no commit, no tag,
      # and no refusal to run against a working tree it considers dirty. The
      # commit below is ours to make. package-lock.json carries the version too,
      # and npm updates both, so they cannot drift apart.
      - name: Bump
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          # Nothing to do if the version somehow did not move. Committing an
          # empty change would fail the job for no reason.
          if git diff --staged --quiet; then
            echo "Version unchanged, nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Everything else runs from here, once the new version is on master, so all
      # of it reports against the commit that ends up at the top of the branch
      # rather than the one below it. That is the whole point: the checkmark
      # GitHub shows above the file list is the bump commit's, and it should mean
      # "tests, database tests and the APK all passed", not "Vercel deployed".
      #
      # Not gated on whether the bump actually committed. If it did not, master's
      # tip is the commit that triggered this run, and dispatching against master
      # still tests and builds exactly the right tree.
      #
      # Both of these work because workflow_dispatch is one of the two events
      # GitHub exempts from the GITHUB_TOKEN loop protection described at the top
      # of this file — a push made with that token starts nothing, which is what
      # keeps the bump from bumping itself.
      - name: Run the checks against the bumped commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "CI" --ref master
          gh workflow run "Android APK" --ref master
          echo "Dispatched CI and the APK build for v${{ steps.bump.outputs.version }}."
